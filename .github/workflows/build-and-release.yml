name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 9.1.1 + Gradle 9.3.1 require JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      # Reads gradle/wrapper/gradle-wrapper.properties (Gradle 9.3.1) and enables caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Android APK
        id: build_apk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          mkdir -p release-assets

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release keystore secrets detected — building signed Release APK..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            $GRADLE_CMD :app:assembleRelease --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            BUILD_TYPE="release"
          else
            echo "Building Debug APK (no release keystore secrets configured)..."
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            elif [ ! -f debug.keystore ]; then
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            $GRADLE_CMD :app:assembleDebug --no-daemon --stacktrace
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            BUILD_TYPE="debug"
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Compiled APK not found!"
            exit 1
          fi

          APK_NAME="RamanQuizChallenge-v1.0.${{ github.run_number }}-${BUILD_TYPE}.apk"
          cp "$APK_SRC" "release-assets/${APK_NAME}"
          echo "apk_path=release-assets/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
          ls -lh "release-assets/${APK_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Raman Quiz Challenge v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Automated Android APK build for **Raman Quiz Challenge**.

            ### Download & Install
            1. Download `${{ steps.build_apk.outputs.apk_name }}` from **Assets** below.
            2. Install the APK on your Android device (Android 7.0+ / API 24+).
            3. On first launch, optionally enter your own free Google Gemini API key to enable AI Quiz Generation (stored locally on your device only).
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
